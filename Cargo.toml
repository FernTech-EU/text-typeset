[package]
name = "text-typeset"
version = "1.4.5"
authors = ["Cyril Jacquet <cyril.jacquet@ferntech.eu>"]
homepage = "https://github.com/jacquetc/text-typeset"
repository = "https://github.com/jacquetc/text-typeset"
documentation = "https://docs.rs/text-typeset/"
description = "Turns rich text documents into GPU-ready glyph quads"
keywords = ["text", "document", "format"]
categories = ["text-editors", "text-processing"]
license = "MPL-2.0"
readme = "README.md"
edition = "2024"

[features]
default = ["text-document"]
text-document = ["dep:text-document"]

[dependencies]
harfrust = "0.7"
swash = "0.2"
fontdb = "0.23.0"
etagere = "0.3"
icu_segmenter = "2"
unicode-bidi = "0.3"
thiserror = "2.0"
text-document = { path = "../text-document/crates/public_api", version = "1.5.6", optional = true }

[dev-dependencies]
text-document = { path = "../text-document/crates/public_api", version = "1.5.6" }
insta = { version = "1.40", features = ["yaml"] }
proptest = "1"

[profile.release]
lto = "fat"
panic = "abort"
strip = true
codegen-units = 1
