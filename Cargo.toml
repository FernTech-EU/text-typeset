[package]
name = "text-typeset"
version = "1.4.5"
authors = ["Cyril Jacquet <cyril.jacquet@ferntech.eu>"]
homepage = "https://github.com/ferntech-eu/text-typeset"
repository = "https://github.com/ferntech-eu/text-typeset"
documentation = "https://docs.rs/text-typeset/"
description = "Turns rich text documents into GPU-ready glyph quads"
keywords = ["text", "document", "format"]
categories = ["text-editors", "text-processing"]
license = "MPL-2.0"
readme = "README.md"
edition = "2024"

[features]
default = ["text-document", "hyphenation-western-european"]
text-document = ["dep:text-document"]

# Hyphenation language coverage. Western European is the default; opt into
# every language hypher ships with `hyphenation-all-languages` (~1.2 MB of
# read-only trie data vs ~0.3 MB). Languages not compiled in fall back to
# soft-hyphen-only breaking at runtime (`hypher::Lang::from_iso` → None).
hyphenation-western-european = [
    "hypher/alloc",
    "hypher/english",
    "hypher/french",
    "hypher/german",
    "hypher/spanish",
    "hypher/italian",
    "hypher/portuguese",
    "hypher/dutch",
]
hyphenation-all-languages = ["hypher/default"]

[dependencies]
harfrust = "0.7"
swash = "0.2"
fontdb = "0.23.0"
etagere = "0.3"
icu_segmenter = "2"
unicode-bidi = "0.3"
thiserror = "2.0"
text-document = { path = "../text-document/crates/public_api", version = "1.5.6", optional = true }
# Languages are gated by this crate's `hyphenation-*` features (see
# [features]); the runtime language is chosen via ISO 639-1 code
# (hypher::Lang::from_iso).
hypher = { version = "0.1.7", default-features = false }

[dev-dependencies]
text-document = { path = "../text-document/crates/public_api", version = "1.5.6" }
insta = { version = "1.40", features = ["yaml"] }
proptest = "1"

[profile.release]
lto = "fat"
panic = "abort"
strip = true
codegen-units = 1
